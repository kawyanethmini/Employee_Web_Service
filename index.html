<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Directory</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
        }

        h2 {
            color: #2c3e50;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px 15px;
            text-align: left;
        }

        th {
            background-color: #3498db;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        form {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            max-width: 400px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        input[type="text"] {
            width: 95%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            background-color: #2ecc71;
            color: white;
            padding: 10px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #27ae60;
        }

        #message {
            color: green;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h2>Employee Directory</h2>

    <table id="employeeTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Department</th>
                <th>Role</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <h3>Add New Employee</h3>
    <form id="employeeForm">
        <input type="text" id="name" placeholder="Employee Name" required>
        <input type="text" id="department" placeholder="Department" required>
        <input type="text" id="role" placeholder="Role" required>
        <button type="submit">Add Employee</button>
        <div id="message"></div>
    </form>

    <script>
        const apiUrl = "api/employe_api.php";

        // Load employees on page load
        function loadEmployees() {
            fetch(apiUrl)
                .then(response => response.json())
                .then(data => {
                    const tbody = document.querySelector("#employeeTable tbody");
                    tbody.innerHTML = "";
                    Object.entries(data).forEach(([id, emp]) => {
                        const row = `
                            <tr>
                                <td>${id}</td>
                                <td>${emp.name}</td>
                                <td>${emp.department}</td>
                                <td>${emp.role}</td>
                            </tr>`;
                        tbody.innerHTML += row;
                    });
                });
        }

        // Handle form submission
        document.getElementById("employeeForm").addEventListener("submit", function(e) {
            e.preventDefault();

            const name = document.getElementById("name").value.trim();
            const department = document.getElementById("department").value.trim();
            const role = document.getElementById("role").value.trim();

            fetch(apiUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name, department, role })
            })
            .then(response => response.json())
            .then(data => {
                if (data.message) {
                    document.getElementById("message").textContent = data.message;
                    loadEmployees();
                    document.getElementById("employeeForm").reset();
                } else {
                    alert("Failed to add employee. Check the API.");
                }
            })
            .catch(error => {
                alert("Error: " + error.message);
            });
        });

        window.onload = loadEmployees;
    </script>
</body>
</html>
